name: Atualizar dados do dashboard

on:
  schedule:
    # A cada 2 horas, alinhado ao horario de Brasilia (UTC-3).
    # GitHub Actions usa UTC: horas impares em UTC (01,03,...,23) caem em
    # horas pares no horario de Brasilia (22,00,02,...,20).
    - cron: '0 1-23/2 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar rclone (script oficial, versao atual)
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Restaurar configuracao do rclone (OneDrive)
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF_CONTENT" | tr -d '\r' > ~/.config/rclone/rclone.conf

      - name: Baixar planilhas do OneDrive
        run: |
          mkdir -p onedrive_sync
          rclone copy "onedrive:Planilhas 2026 - PP-AGN" "onedrive_sync/Planilhas 2026 - PP-AGN" --max-age 60d
          rclone copy "onedrive:Planilhas 2026 - PP-VEL" "onedrive_sync/Planilhas 2026 - PP-VEL" --max-age 60d
          rclone copy "onedrive:Planilhas 2026 - PS-FLC" "onedrive_sync/Planilhas 2026 - PS-FLC" --max-age 60d
          rclone copy "onedrive:Planilhas 2026 - PS-NFA" "onedrive_sync/Planilhas 2026 - PS-NFA" --max-age 60d
          rclone copy "onedrive:Planilhas 2026" "onedrive_sync/Planilhas 2026" --max-age 60d --include "*.xls" --include "*.xlsx"
          rclone copy "onedrive:Planilhas 2026 - G700 - N444R" "onedrive_sync/Planilhas 2026 - G700 - N444R" --max-age 60d
          rclone copy "onedrive:Planilhas 2026 - PS-JAJ" "onedrive_sync/Planilhas 2026 - PS-JAJ" --max-age 60d
          rclone copy "onedrive:Planilhas 2026 - PS-STP" "onedrive_sync/Planilhas 2026 - PS-STP" --max-age 60d
          rclone copy "onedrive:Gulfstream G450-N918LL/Planilhas 2026 - N918LL" "onedrive_sync/Gulfstream G450-N918LL/Planilhas 2026 - N918LL" --max-age 60d

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install xlrd openpyxl

      - name: Rodar parser.py
        env:
          ONEDRIVE_BASE: ${{ github.workspace }}/onedrive_sync
        run: python parser.py

      - name: Copiar documentos PDF do OneDrive (PS-NFA, PS-STP)
        continue-on-error: true
        run: |
          # Baixa os PDFs da pasta de documentos de cada aeronave e os publica
          # com nomes ESTAVEIS dentro do site, para que os links dos botoes nao
          # quebrem quando o nome do arquivo de origem mudar (ex: a cada release).
          # Cada aeronave tem sua propria pasta no OneDrive; dentro dela:
          #   - "ON BOARD DOCS*.pdf"  -> documentos-de-bordo.pdf
          #   - "*LAST RELEASE*.pdf"  -> ultima-liberacao.pdf (o mais recente)
          copiar_docs () {
            reg="$1"; src="$2"
            tmp="onedrive_docs/$reg"
            mkdir -p "$tmp" "site/docs/$reg"
            rclone copy "$src" "$tmp" --include "*.pdf"
            bordo=$(find "$tmp" -maxdepth 1 -type f -iname "ON BOARD DOCS*.pdf" -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2- || true)
            rel=$(find "$tmp" -maxdepth 1 -type f -iname "*LAST RELEASE*.pdf" -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2- || true)
            if [ -n "$bordo" ]; then cp "$bordo" "site/docs/$reg/documentos-de-bordo.pdf"; echo "$reg bordo   <- $bordo"; else echo "AVISO: $reg sem 'ON BOARD DOCS*.pdf'"; fi
            if [ -n "$rel" ];   then cp "$rel"   "site/docs/$reg/ultima-liberacao.pdf";   echo "$reg release <- $rel";   else echo "AVISO: $reg sem 'LAST RELEASE*.pdf'"; fi
          }
          copiar_docs "PP-VEL" "onedrive:LAST RELEASE-ON BOARD DOCS-PP-VEL"
          copiar_docs "PS-NFA" "onedrive:LAST RELEASE-ON BOARD DOCS-PS-NFA"
          copiar_docs "PS-STP" "onedrive:LAST RELEASE-ON BOARD DOCS-PS-STP"
          ls -la site/docs/PP-VEL/ site/docs/PS-NFA/ site/docs/PS-STP/

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/pages-action@v1
        env:
          CI: 'true'
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PROJECT_NAME }}
          directory: site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
